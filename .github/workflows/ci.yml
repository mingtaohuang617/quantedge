name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend deps + ruff + pytest
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff==0.15.13 pytest==9.0.3
          pip check
      - name: Ruff check
        run: ruff check backend
      - name: Security boundary and data contract
        run: pytest backend/tests/test_security_boundary.py --tb=short
      - name: Pytest (no network)
        run: pytest backend/tests -m "not network and not slow" --tb=short

      # Mining Alpha 烟雾测试：合成数据跑 compute-factors，验证 191+36 个因子全部能算
      - name: Mining Alpha smoke (synthetic data)
        run: |
          cd backend
          python -m mining_alpha.synthetic_demo --n-stocks 30 --years 1 --seed 0
          python -m mining_alpha.run compute-factors \
            --universe DEMO --start 2025-05-01 --end 2026-05-18 \
            --run-id ci --factor-sets all
          python -m mining_alpha.catalog --output ../docs/_ci_catalog_check.md
          test -f output/mining_alpha/factors/_tradeable_mask.parquet

  frontend:
    name: Frontend (build + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Audit imports (lucide / react / recharts — 拦截漏 import 上线)
        run: npm run audit:imports
      - name: Audit i18n
        run: npm run audit:i18n:all
      - name: Version consistency
        run: npm run check:version
      - name: Vercel function budget
        run: npm run check:vercel-functions
      - name: Vitest
        run: npm test
      - name: Vite build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # H6: Playwright E2E — 在 build 产物上跑 chromium，验证关键路径
  e2e:
    name: Frontend (E2E · Playwright)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browser (chromium only)
        run: npx playwright install --with-deps chromium
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Playwright test
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Lighthouse fixed lab baseline
        shell: bash
        run: |
          mkdir -p .lighthouse
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/quantedge-preview.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          npx lighthouse http://127.0.0.1:4173/ --chrome-flags="--headless --no-sandbox" --only-categories=performance --output=json --output-path=.lighthouse/report.json
          npm run check:lighthouse -- .lighthouse/report.json
      - name: Upload Lighthouse report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/.lighthouse
          retention-days: 7

  deploy-preview:
    name: Deploy and verify Vercel Preview
    runs-on: ubuntu-latest
    needs: [frontend, e2e]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.9.1
      - name: Build Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          vercel build --token=$VERCEL_TOKEN
      - name: Deploy Preview
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          deployment_url=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          preview_url="${{ steps.preview.outputs.url }}"
          vercel inspect "$preview_url" --wait --timeout=5m --token=$VERCEL_TOKEN
          check_preview() {
            path="$1"
            allowed="$2"
            status=$(vercel curl "$path" --deployment "$preview_url" --token=$VERCEL_TOKEN -- --silent --show-error --output /dev/null --write-out "%{http_code}" | tail -n 1)
            echo "$path -> $status"
            case ",$allowed," in
              *",$status,"*) ;;
              *) echo "Unexpected status for $path: $status"; exit 1 ;;
            esac
          }
          check_preview "/" "200"
          check_preview "/sw.js" "200"
          check_preview "/api/auth/session" "401,403"
          check_preview "/api/yahoo?path=%2Fv8%2Ffinance%2Fchart%2FSPY" "401,403"

  # H6: 自动部署到 Vercel — 仅 push 到 main 时触发，需配置 secrets
  # 必需 secrets:
  #   VERCEL_TOKEN       — vercel.com/account/tokens 创建
  #   VERCEL_ORG_ID      — 见 .vercel/project.json
  #   VERCEL_PROJECT_ID  — 见 .vercel/project.json
  deploy-prod:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    needs: [frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Vercel CLI
        run: npm install --global vercel@59.9.1
      - name: Pull Vercel env (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # 不再 continue-on-error — secrets 已配，pull 失败就该让 deploy 红
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
      - name: Build with Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN
      - name: Record previous Ready deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel list --prod --token=$VERCEL_TOKEN > previous-ready-deployments.txt
      - name: Deploy prebuilt artifact
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify deployment status and core paths
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel inspect "${{ steps.deploy.outputs.url }}" --wait --timeout=5m --token=$VERCEL_TOKEN
          node frontend/scripts/smoke-production.mjs "${{ steps.deploy.outputs.url }}"
      - name: Check recent production errors
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          vercel logs --deployment "${{ steps.deploy.outputs.url }}" --environment production --status-code 5xx --since 10m --limit 50 --json --token=$VERCEL_TOKEN > recent-5xx.jsonl
          if [ -s recent-5xx.jsonl ]; then cat recent-5xx.jsonl; exit 1; fi
      - name: Upload rollback record
        uses: actions/upload-artifact@v4
        with:
          name: previous-ready-deployments
          path: previous-ready-deployments.txt
          retention-days: 14
