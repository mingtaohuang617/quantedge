<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0B0B15" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0f2f8" media="(prefers-color-scheme: light)" />
    <meta name="description" content="QuantEdge — 综合量化投资平台。多因子评分、组合回测、实时监控、宏观看板、10x 猎手。覆盖美股 / 港股 / A 股 / 韩股。" />
    <meta name="robots" content="noindex" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Open Graph / Twitter — 分享链接缩略图 + 描述 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QuantEdge" />
    <meta property="og:title" content="QuantEdge — 综合量化投资平台" />
    <meta property="og:description" content="多因子评分 · 组合回测 · 实时监控 · 宏观看板 · 10x 猎手。" />
    <meta property="og:image" content="/icon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="QuantEdge — 综合量化投资平台" />
    <meta name="twitter:description" content="多因子评分 · 组合回测 · 实时监控 · 宏观看板 · 10x 猎手。" />
    <meta name="twitter:image" content="/icon.svg" />

    <style>
      html,body,#root{min-height:100%;margin:0}body{background:#0b0b15;color:#f7f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      .qe-boot{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(99,102,241,.14),transparent 34%),#0b0b15}
      .qe-boot__card{text-align:center;padding:32px}.qe-boot__mark{width:42px;height:42px;margin:0 auto 18px;border:1px solid rgba(129,140,248,.55);border-radius:13px;display:grid;place-items:center;color:#a5b4fc;font:700 18px ui-monospace,monospace;box-shadow:0 0 32px rgba(99,102,241,.16)}
      .qe-boot h1{margin:0;font-size:30px;letter-spacing:-.04em}.qe-boot p{margin:8px 0 0;color:#8f93a8;font-size:13px}.qe-boot__line{width:96px;height:2px;margin:22px auto 0;overflow:hidden;border-radius:2px;background:rgba(255,255,255,.08)}.qe-boot__line:after{content:"";display:block;width:42%;height:100%;background:#818cf8;animation:qe-boot 1.1s ease-in-out infinite alternate}@keyframes qe-boot{to{transform:translateX(140%)}}
      @media(prefers-reduced-motion:reduce){.qe-boot__line:after{animation:none}}
      @media(prefers-color-scheme:light){body{background:#f0f2f8;color:#181924}.qe-boot{background:radial-gradient(circle at 50% 35%,rgba(99,102,241,.1),transparent 34%),#f0f2f8}.qe-boot p{color:#656a7d}}
    </style>

    <title>QuantEdge</title>
  </head>
  <body>
    <div id="root"><div class="qe-boot" aria-hidden="true"><div class="qe-boot__card"><div class="qe-boot__mark">QE</div><h1>QuantEdge</h1><p>正在建立安全会话</p><div class="qe-boot__line"></div></div></div></div>
    <!-- v7: 无闪烁应用强调色主题（在 React 挂载前设置 data-theme） -->
    <script>
      (function () { try { var a = localStorage.getItem('quantedge_accent'); if (a && a !== 'indigo') document.documentElement.dataset.theme = a; } catch (e) {} })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
